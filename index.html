<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Draft Helper</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        header {
            padding: 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            background: #3b82f6;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .reset {
            background: #ef4444;
        }

        .drafted-count {
            background: #334155;
            padding: 10px 15px;
            border-radius: 7px;
            font-weight: bold;
        }

        .container {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .rankings {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .ranking-column {
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .column-header {
            padding: 15px;
            background: #334155;
            font-size: 20px;
            font-weight: bold;
            position: sticky;
            top: 101px;
            z-index: 10;
        }

        .my-header {
            background: #166534;
        }

        .player {
            display: grid;
            grid-template-columns: 45px 1fr;
            align-items: center;
            min-height: 48px;
            padding: 7px 12px;
            border-bottom: 1px solid #334155;
            cursor: pointer;
            transition: background 0.15s;
        }

        .player:hover {
            background: #334155;
        }

        .rank {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
        }

        .name {
            font-size: 16px;
            font-weight: 600;
        }

        /*
            Players selected/drafted are crossed out.
        */
        .player.drafted {
            opacity: 0.35;
            text-decoration: line-through;
            background: #111827;
        }

        .player.drafted .rank {
            text-decoration: line-through;
        }

        /*
            Only My Rank players can actually be clicked.
        */
        .ranking-column:not(.my-ranking) .player {
            cursor: default;
        }

        .ranking-column:not(.my-ranking) .player:hover {
            background: transparent;
        }

        .search-container {
            margin-bottom: 20px;
        }

        #search {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 16px;
        }

        #search::placeholder {
            color: #94a3b8;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 900px) {
            .rankings {
                grid-template-columns: 1fr;
            }

            .column-header {
                position: static;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏈 Fantasy Football Draft Helper</h1>
    <div class="subtitle">
        Click a player in <strong>My Rank</strong> when they get drafted.
        They'll automatically be crossed out on all rankings.
    </div>

    <div class="controls">
        <button class="reset" onclick="resetDraft()">Reset Draft</button>

        <div class="drafted-count">
            Drafted: <span id="draftedCount">0</span>
        </div>
    </div>
</header>


<div class="container">

    <div class="search-container">
        <input
            type="text"
            id="search"
            placeholder="Search for a player..."
            oninput="searchPlayers()"
        >
    </div>

    <div class="rankings">

        <!-- MY RANK -->
        <div class="ranking-column my-ranking">
            <div class="column-header my-header">
                ⭐ My Rank
            </div>

            <div id="myRank"></div>
        </div>


        <!-- DURACELL -->
        <div class="ranking-column">
            <div class="column-header">
                🔋 Duracell
            </div>

            <div id="duracell"></div>
        </div>


        <!-- NFFC -->
        <div class="ranking-column">
            <div class="column-header">
                📊 NFFC
            </div>

            <div id="nffc"></div>
        </div>

    </div>
</div>

/*
===========================================================
DRAFT STATE
===========================================================
*/

let draftedPlayers = new Set();


/*
===========================================================
RENDER RANKINGS
===========================================================
*/

function renderRanking(containerId, order, type, clickable = false) {

    const container = document.getElementById(containerId);

    container.innerHTML = "";

    order.forEach((playerId, index) => {

        const player = players[playerId];

        // Skip players that don't have a name for this ranking
        if (!player || !player[type]) {
            return;
        }

        const row = document.createElement("div");

        row.className = "player";

        if (draftedPlayers.has(playerId)) {
            row.classList.add("drafted");
        }

        row.dataset.playerId = playerId;

        row.innerHTML = `
            <div class="rank">${index + 1}</div>
            <div class="name">${player[type]}</div>
        `;

        if (clickable) {

            row.onclick = () => {

                toggleDrafted(playerId);

            };

        }

        container.appendChild(row);
    });
}


/*
===========================================================
RENDER EVERYTHING
===========================================================
*/

function renderAll() {

    renderRanking(
        "myRank",
        myRankOrder,
        "my",
        true
    );

    renderRanking(
        "duracell",
        duracellOrder,
        "duracell",
        false
    );

    renderRanking(
        "nffc",
        nffcOrder,
        "nffc",
        false
    );

    document.getElementById("draftedCount").textContent =
        draftedPlayers.size;

    searchPlayers();
}


/*
===========================================================
TOGGLE PLAYER

This is the key function.

Clicking a player in MY RANK adds their canonical ID
to draftedPlayers.

Because every ranking uses the same ID, they all
automatically get crossed out.
===========================================================
*/

function toggleDrafted(playerId) {

    if (draftedPlayers.has(playerId)) {

        draftedPlayers.delete(playerId);

    } else {

        draftedPlayers.add(playerId);

    }

    renderAll();

}


/*
===========================================================
RESET
===========================================================
*/

function resetDraft() {

    if (
        draftedPlayers.size > 0 &&
        !confirm("Reset all drafted players?")
    ) {
        return;
    }

    draftedPlayers.clear();

    renderAll();
}


/*
===========================================================
SEARCH
===========================================================
*/

function searchPlayers() {

    const searchTerm =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    document
        .querySelectorAll(".player")
        .forEach(row => {

            const playerId = row.dataset.playerId;

            const player = players[playerId];

            if (!player) {
                return;
            }

            const searchableText =
                JSON.stringify(player).toLowerCase();

            if (
                searchTerm === "" ||
                searchableText.includes(searchTerm)
            ) {

                row.classList.remove("hidden");

            } else {

                row.classList.add("hidden");

            }

        });
}


/*
===========================================================
START APP
===========================================================
*/

renderAll();
