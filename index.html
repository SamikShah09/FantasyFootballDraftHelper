<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fantasy Football Draft Helper</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1115;
            color: #ffffff;
        }

        header {
            padding: 22px 30px;
            background: #171a21;
            border-bottom: 1px solid #2c3038;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
        }

        header p {
            margin: 0;
            color: #9da3ae;
        }

        .controls {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        #search {
            width: 300px;
            max-width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #383d47;
            background: #0d0f13;
            color: white;
            outline: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #resetBtn {
            background: #e74c3c;
            color: white;
        }

        #resetBtn:hover {
            background: #c0392b;
        }

        .draft-info {
            margin-left: auto;
            color: #9da3ae;
            padding: 10px;
        }

        .board-wrapper {
            overflow-x: auto;
            padding: 25px;
        }

        .board {
            display: grid;

            /*
                5 ranking columns + rank column
            */
            grid-template-columns:
                55px
                repeat(5, minmax(220px, 1fr));

            min-width: 1200px;

            border: 1px solid #30343d;
            border-radius: 12px;
            overflow: hidden;
            background: #15181e;
        }

        .header-cell {
            background: #20242c;
            padding: 15px 12px;
            font-weight: bold;
            border-right: 1px solid #30343d;
            border-bottom: 1px solid #30343d;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-cell.rank-header {
            text-align: center;
        }

        .ranking-header {
            text-align: center;
            font-size: 16px;
        }

        .my-header {
            background: #283d2b;
        }

        .duracell-header {
            background: #303044;
        }

        .nffc-header {
            background: #443b2b;
        }

        .flock-header {
            background: #3a2d45;
        }

        .ron-header {
            background: #263b47;
        }

        .rank-cell {
            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;
            color: #7f8794;

            min-height: 48px;

            border-right: 1px solid #30343d;
            border-bottom: 1px solid #282c33;
        }

        .player-cell {
            min-height: 48px;

            display: flex;
            align-items: center;

            padding: 8px 12px;

            border-right: 1px solid #30343d;
            border-bottom: 1px solid #282c33;

            cursor: pointer;

            transition:
                background 0.15s ease,
                opacity 0.15s ease;
        }

        .player-cell:hover {
            background: #252a33;
        }

        .player-name {
            font-size: 15px;
            font-weight: 600;
        }

        .player-rank {
            margin-left: auto;
            color: #666d79;
            font-size: 12px;
        }

        /*
            CROSS OUT
        */

        .player-cell.drafted {
            background: #111317;
            opacity: 0.32;
        }

        .player-cell.drafted .player-name {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        .player-cell.drafted::after {
            content: "DRAFTED";
            margin-left: 10px;
            font-size: 9px;
            font-weight: bold;
            color: #777e89;
        }

        /*
            Search highlighting
        */

        .player-cell.hidden {
            display: none;
        }

        .rank-cell.hidden {
            display: none;
        }

        /*
            MOBILE
        */

        @media (max-width: 700px) {
            header {
                padding: 18px;
            }

            header h1 {
                font-size: 22px;
            }

            .board-wrapper {
                padding: 12px;
            }

            .board {
                min-width: 1150px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🏈 Fantasy Football Draft Helper</h1>

    <p>
        Click any player in any ranking to cross them off everywhere.
    </p>

    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="Search for a player..."
        >

        <button id="resetBtn">
            Reset Draft
        </button>

        <div class="draft-info">

    </div>

</header>

/*
===========================================================
HELPER
===========================================================
*/

function canonicalize(name) {

    if (!name) return null;

    let cleaned = name
        .trim()
        .toLowerCase()
        .replace(/[’]/g, "'")
        .replace(/\s+/g, " ");

    return aliases[cleaned] || name.trim();
}

/*
===========================================================
DRAFTED PLAYERS
===========================================================
*/

let draftedPlayers = new Set();


/*
===========================================================
BUILD BOARD
===========================================================
*/

function buildBoard() {

    const board = document.getElementById("board");

    /*
        Remove everything except the headers.
    */

    while (board.children.length > 6) {
        board.removeChild(board.lastChild);
    }

    /*
        Find longest ranking.
    */

    const maxLength = Math.max(
        ...rankings.map(ranking => ranking.players.length)
    );


    /*
        Create rows.
    */

    for (let i = 0; i < maxLength; i++) {

        /*
            Rank number
        */

        const rankCell = document.createElement("div");

        rankCell.className = "rank-cell";

        rankCell.textContent = i + 1;

        board.appendChild(rankCell);


        /*
            Each ranking
        */

        rankings.forEach(ranking => {

            const cell = document.createElement("div");

            cell.className = "player-cell";

            const player = ranking.players[i];

            if (!player) {

                cell.innerHTML = "";

                board.appendChild(cell);

                return;
            }


            /*
                Canonical player name
            */

            const canonicalName = canonicalize(player);


            /*
                Player display
            */

            const name = document.createElement("span");

            name.className = "player-name";

            name.textContent = player;


            /*
                Rank number
            */

            const rank = document.createElement("span");

            rank.className = "player-rank";

            rank.textContent = `#${i + 1}`;


            cell.appendChild(name);
            cell.appendChild(rank);


            /*
                If already drafted, cross out.
            */

            if (draftedPlayers.has(canonicalName)) {

                cell.classList.add("drafted");

            }


            /*
                CLICK ANY PLAYER
            */

            cell.addEventListener("click", () => {

                togglePlayer(canonicalName);

            });


            /*
                Store canonical name on element
            */

            cell.dataset.player = canonicalName;


            board.appendChild(cell);

        });

    }


    updateCount();

}


/*
===========================================================
TOGGLE PLAYER
===========================================================
*/

function togglePlayer(player) {

    if (draftedPlayers.has(player)) {

        draftedPlayers.delete(player);

    } else {

        draftedPlayers.add(player);

    }


    /*
        Update EVERY occurrence of this player.
    */

    document
        .querySelectorAll(".player-cell")
        .forEach(cell => {

            if (cell.dataset.player === player) {

                if (draftedPlayers.has(player)) {

                    cell.classList.add("drafted");

                } else {

                    cell.classList.remove("drafted");

                }

            }

        });


    updateCount();

}


/*
===========================================================
UPDATE DRAFTED COUNT
===========================================================
*/

function updateCount() {

    document.getElementById("draftedCount").textContent =
        draftedPlayers.size;

}


/*
===========================================================
RESET
===========================================================
*/

document
    .getElementById("resetBtn")
    .addEventListener("click", () => {

        if (
            confirm("Reset all drafted players?")
        ) {

            draftedPlayers.clear();

            document
                .querySelectorAll(".player-cell.drafted")
                .forEach(cell => {

                    cell.classList.remove("drafted");

                });

            updateCount();

        }

    });


/*
===========================================================
SEARCH
===========================================================
*/

document
    .getElementById("search")
    .addEventListener("input", function() {

        const query = this.value
            .trim()
            .toLowerCase();


        document
            .querySelectorAll(".player-cell")
            .forEach(cell => {

                const player =
                    cell.dataset.player || "";

                const displayName =
                    cell
                        .querySelector(".player-name")
                        ?.textContent
                        .toLowerCase() || "";


                if (!query) {

                    cell.classList.remove("hidden");

                    return;

                }


                const matches =
                    player.toLowerCase().includes(query) ||
                    displayName.includes(query);


                if (matches) {

                    cell.classList.remove("hidden");

                } else {

                    cell.classList.add("hidden");

                }

            });

    });


/*
===========================================================
INITIALIZE
===========================================================
*/

buildBoard();
