<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Football Draft Helper</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0b0f14;
        color: #f5f7fa;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #111820;
        border-bottom: 1px solid #29323c;
        padding: 16px 20px;
    }

    .topbar-inner {
        max-width: 1900px;
        margin: auto;
    }

    h1 {
        margin: 0 0 12px 0;
        font-size: 26px;
    }

    .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    #search {
        flex: 1;
        min-width: 250px;
        max-width: 500px;
        background: #1a222c;
        border: 1px solid #394451;
        color: white;
        padding: 11px 14px;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    #search:focus {
        border-color: #5b9cff;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 11px 16px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }

    #resetBtn {
        background: #e74c3c;
        color: white;
    }

    #resetBtn:hover {
        background: #ff5c4d;
    }

    .stats {
        margin-left: auto;
        background: #1a222c;
        border: 1px solid #394451;
        padding: 10px 15px;
        border-radius: 8px;
        font-weight: bold;
        white-space: nowrap;
    }

    /* =========================
       RANKINGS
    ========================= */

    .rankings-wrapper {
        width: 100%;
        overflow-x: auto;
        padding: 15px;
    }

    .rankings {
        display: grid;

        /*
          ALWAYS 5 COLUMNS.
          They do not stack vertically.
        */
        grid-template-columns:
            repeat(5, minmax(250px, 1fr));

        gap: 12px;

        /*
          This guarantees the columns remain
          side-by-side even on smaller screens.
        */
        min-width: 1320px;

        max-width: 1900px;
        margin: auto;
    }

    .ranking-column {
        background: #121922;
        border: 1px solid #293440;
        border-radius: 10px;
        overflow: hidden;
        min-width: 250px;
    }

    .column-header {
        position: sticky;
        top: 84px;
        z-index: 20;

        background: #17212b;
        border-bottom: 1px solid #35404c;

        padding: 15px;
        text-align: center;

        font-size: 18px;
        font-weight: bold;
    }

    .my-header {
        border-top: 4px solid #4da3ff;
    }

    .duracell-header {
        border-top: 4px solid #f6c945;
    }

    .nffc-header {
        border-top: 4px solid #8e6cff;
    }

    .flock-header {
        border-top: 4px solid #35d07f;
    }

    .ron-header {
        border-top: 4px solid #ff6b6b;
    }

    .player-list {
        padding: 5px;
    }

    /* =========================
       PLAYER ROW
    ========================= */

    .player {
        position: relative;

        display: flex;
        align-items: center;

        gap: 8px;

        padding: 9px 8px;
        margin: 2px 0;

        min-height: 42px;

        background: #17202a;

        border-radius: 6px;

        cursor: pointer;

        transition:
            background 0.12s,
            opacity 0.12s,
            transform 0.12s;
    }

    .player:hover {
        background: #22303d;
        transform: translateX(2px);
    }

    .rank {
        width: 34px;
        flex-shrink: 0;

        color: #7f8c9a;

        font-size: 13px;
        font-weight: bold;

        text-align: right;
    }

    .player-name {
        font-size: 14px;
        font-weight: 600;

        flex: 1;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /*
      CROSS-OFF STYLE
    */

    .player.drafted {
        opacity: 0.35;
        background: #0d1217;
    }

    .player.drafted .player-name {
        text-decoration: line-through;
        text-decoration-thickness: 2px;
        color: #7f8b96;
    }

    .player.drafted .rank {
        color: #505b66;
    }

    .drafted-mark {
        display: none;

        width: 20px;
        height: 20px;

        border-radius: 50%;

        background: #e74c3c;
        color: white;

        font-size: 12px;
        font-weight: bold;

        align-items: center;
        justify-content: center;
    }

    .player.drafted .drafted-mark {
        display: flex;
    }

    /* =========================
       SEARCH
    ========================= */

    .player.hidden {
        display: none;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
        text-align: center;
        color: #6f7b87;
        padding: 25px;
        font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        .topbar {
            padding: 12px;
        }

        h1 {
            font-size: 21px;
        }

        .rankings-wrapper {
            padding: 10px;
        }

        /*
          Still side-by-side.
          User horizontally scrolls.
        */
        .rankings {
            grid-template-columns:
                repeat(5, 250px);

            min-width: 1280px;
        }

        .column-header {
            top: 76px;
        }

        .stats {
            margin-left: 0;
        }
    }
</style>
</head>

/* =========================================================
   NORMALIZE NAME
========================================================= */

function normalizeName(name) {

    let value = name
        .toLowerCase()
        .trim()
        .replace(/[’]/g, "'");

    /*
       First check our manually-created aliases.
    */

    if (aliases[value]) {
        return aliases[value];
    }

    /*
       If there isn't an alias, create a reasonable
       automatic ID.

       This means most exact names still match.
    */

    return value
        .replace(/[.'’]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
}


/* =========================================================
   DRAFTED PLAYERS
========================================================= */

let draftedPlayers = new Set();


/* =========================================================
   SAVE / LOAD
========================================================= */

function saveDraft() {

    localStorage.setItem(
        "fantasyDraftedPlayers",
        JSON.stringify([...draftedPlayers])
    );
}


function loadDraft() {

    const saved =
        localStorage.getItem("fantasyDraftedPlayers");

    if (!saved) {
        return;
    }

    try {

        draftedPlayers =
            new Set(JSON.parse(saved));

    } catch (error) {

        draftedPlayers = new Set();

    }
}


/* =========================================================
   DRAFT / UNDRAFT
========================================================= */

function togglePlayer(playerName) {

    const playerId =
        normalizeName(playerName);

    /*
       If already drafted, clicking again
       removes the cross-off.
    */

    if (draftedPlayers.has(playerId)) {

        draftedPlayers.delete(playerId);

    } else {

        draftedPlayers.add(playerId);

    }

    saveDraft();

    renderAllRankings();
}


/* =========================================================
   CREATE PLAYER ELEMENT
========================================================= */

function createPlayerElement(playerName, rank) {

    const playerId =
        normalizeName(playerName);

    const player =
        document.createElement("div");

    player.className = "player";

    player.dataset.playerId =
        playerId;

    player.dataset.name =
        playerName.toLowerCase();

    /*
       Is this player already drafted?
    */

    if (draftedPlayers.has(playerId)) {

        player.classList.add("drafted");

    }

    player.innerHTML = `

        <div class="rank">
            ${rank}
        </div>

        <div class="player-name">
            ${escapeHtml(playerName)}
        </div>

        <div class="drafted-mark">
            ✓
        </div>

    `;

    /*
       CLICK ANY PLAYER
       =================

       This is what causes the player
       to disappear/cross off in ALL
       five rankings.
    */

    player.addEventListener(
        "click",
        () => togglePlayer(playerName)
    );

    return player;
}


/* =========================================================
   RENDER ONE RANKING
========================================================= */

function renderRanking(ranking) {

    const container =
        document.getElementById(ranking.element);

    container.innerHTML = "";

    if (ranking.players.length === 0) {

        container.innerHTML =
            `<div class="empty">No players</div>`;

        return;
    }

    ranking.players.forEach(
        (playerName, index) => {

            const playerElement =
                createPlayerElement(
                    playerName,
                    index + 1
                );

            container.appendChild(
                playerElement
            );

        }
    );
}


/* =========================================================
   RENDER ALL 5 RANKINGS
========================================================= */

function renderAllRankings() {

    Object.values(rankings)
        .forEach(renderRanking);

    updateStats();

    applySearch();
}


/* =========================================================
   UPDATE COUNTER
========================================================= */

function updateStats() {

    document.getElementById(
        "draftedCount"
    ).textContent =
        draftedPlayers.size;
}


/* =========================================================
   SEARCH
========================================================= */

const searchInput =
    document.getElementById("search");


searchInput.addEventListener(
    "input",
    applySearch
);


function applySearch() {

    const query =
        searchInput.value
            .toLowerCase()
            .trim();

    const players =
        document.querySelectorAll(".player");

    players.forEach(player => {

        const name =
            player.dataset.name;

        if (
            !query ||
            name.includes(query)
        ) {

            player.classList.remove(
                "hidden"
            );

        } else {

            player.classList.add(
                "hidden"
            );

        }

    });
}


/* =========================================================
   RESET
========================================================= */

document.getElementById(
    "resetBtn"
).addEventListener(
    "click",
    () => {

        const confirmed =
            confirm(
                "Are you sure you want to reset all drafted players?"
            );

        if (!confirmed) {
            return;
        }

        draftedPlayers.clear();

        saveDraft();

        renderAllRankings();
    }
);


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   START APP
========================================================= */

loadDraft();

renderAllRankings();

</script>
